<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - ذاكرة تيارت</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #121212, #1e1e1e);
      font-family: 'Cairo', sans-serif;
    }
    .login-container {
      background: #1c1c1c;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
      text-align: center;
      width: 90%;
      max-width: 400px;
      color: #ffd700;
    }
    .login-container h1 {
      margin-bottom: 30px;
      font-size: 2rem;
    }
    .login-container input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: #333;
      color: #ffd700;
      font-size: 1rem;
    }
    .login-container button {
      width: 100%;
      padding: 15px;
      background: #ffd700;
      color: #121212;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      margin-top: 20px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    .login-container button:hover {
      background: #e6c200;
    }
    .login-container .link {
      display: block;
      margin-top: 15px;
      font-size: 0.9rem;
      color: #bbb;
      text-decoration: none;
    }
    .error-message {
      color: red;
      margin-top: 10px;
      font-size: 0.9rem;
      display: none;
    }
  </style>
</head>
<body>

<div class="login-container">
  <h1>تسجيل الدخول</h1>
  <input type="text" id="username" placeholder="اسم المستخدم">
  <input type="password" id="password" placeholder="كلمة المرور">
  <div id="error" class="error-message">يرجى ملء جميع الحقول بشكل صحيح</div>
  <button onclick="login()">دخول</button>
  <a class="back" href="login1.html">انشاء حساب جديد</a>
</div>

<script>
function login() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value.trim();
  const error = document.getElementById('error');

  if (username === '' || password === '') {
    error.style.display = 'block';
  } else {
    error.style.display = 'none';
    // هنا يمكن توجيه المستخدم إلى الصفحة الرئيسية أو التحقق من البيانات
    alert('تم تسجيل الدخول بنجاح!');
  }
}
</script>

</body>
</html>
